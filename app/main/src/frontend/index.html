<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Application OSINT - Collecte, Capitalisation et Exploitation d'informations">
    <title>OSINT App</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <script>
        // Appliquer le thème sombre par défaut
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="dark bg-gray-900 text-gray-100">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
