[package]
name = "osint_secrets"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async
tokio = { version = "1.0", features = ["full"] }

# Crypto
zeroize = "1.6"
hkdf = "0.12"
rand = "0.8"
base64 = "0.21"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Keychain (macOS)
keyring = "2.0"

# IPC (Unix Domain Sockets)
interprocess = "2.0"

# Chiffrement
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"

# Utilitaires
lazy_static = "1.4"
dirs = "5.0"

# Gestion des erreurs
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Partagé
osint_shared = { path = "../shared" }

[build-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
