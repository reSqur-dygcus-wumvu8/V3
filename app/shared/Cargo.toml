[package]
name = "osint_shared"
version = "0.1.0"
edition = "2021"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Types partagés
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Chiffrement
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"

# Utilitaires
lazy_static = "1.4"
dirs = "5.0"
hex = "0.4"
